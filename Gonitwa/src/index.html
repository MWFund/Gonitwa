<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title></title>
	<script type="text/javascript" src="jsfxr.js"></script>
	<script type="text/javascript" src="game-audio.js"></script>
	<script type="text/javascript" src="stats.js"></script>
	<script type="text/javascript" src="stats-wrapper.js"></script>
	<script type="text/javascript" src="requestAnimationFame.js"></script>
	<script type="text/javascript" src="game.js"></script>
	<style type="text/css">
		body{
			background-color: #000;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			-khtml-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}
		html,body,canvas{
			margin:0;
			padding: 0;
		}
		canvas,svg{
			display: block;
			position: absolute;
			top: 0;
			left: 0;
		}
		svg{
			overflow: hidden;
		}
		#root{
			cursor: pointer;
		}
		.help{
			box-sizing: border-box;
			font-size: 14px;
			padding: 8px;
			color: #999;
			font-family: sans-serif;
			text-align:center;
			position: absolute;
			left:0;
			bottom: 0;
			width: 100%;
		}
		.speed-control{
			box-sizing: border-box;
			padding: 10px;
			color: #fff;
			background-color: rgba(0, 0, 0, 0.7);
			font-family: sans-serif;
			position: absolute;
			top: 10px;
			right: 10px;
			border-radius: 5px;
			font-size: 14px;
		}
		.speed-control label{
			display: block;
			margin-bottom: 5px;
		}
		.speed-control input[type="range"]{
			width: 150px;
		}
		.speed-control .speed-value{
			color: #ff9800;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<div class="speed-control">
		<label>Prędkość gry: <span class="speed-value">5</span></label>
		<input type="range" id="speedSlider" min="1" max="10" value="5" step="1">
	</div>
	<div class="help">
		Use arrow keys or mouse to move around. <br>
		You can use the 'return' key to pause the game (but that's cheating !). <br>
		You don't need to really know the <a href="https://en.wikipedia.org/wiki/Chess#Movement">chess rules</a> to play, but that could definitely help!
	</div>
</body>
</html>
