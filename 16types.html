<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Osobowości MBTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --bg-start: #eef2ff;
            --bg-end: #e0e7ff;
            --text: #334155;
            --white: #ffffff;
            --radius: 12px;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 50%, #c7d2fe 100%);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 800px;
            padding: 48px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.12), 0 4px 16px rgba(0,0,0,0.06);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        h1 {
            color: var(--primary);
            text-align: center;
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95em;
            max-width: 560px;
            margin: 0 auto 30px;
            line-height: 1.7;
        }

        .hidden {
            display: none !important;
        }

        /* Gender Selection */
        .gender-select {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Question Cards */
        .question-card {
            margin-bottom: 30px;
            animation: slideIn 0.35s ease-out;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 100px;
            margin-bottom: 28px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 100px;
        }

        .question-counter {
            text-align: center;
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            font-size: 1.2em;
            margin-bottom: 28px;
            font-weight: 600;
            text-align: center;
            color: var(--primary);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background-color: var(--white);
            border: 2px solid #e2e8f0;
            color: var(--text);
            padding: 18px 20px;
            text-align: left;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.5;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background-color: #eef2ff;
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
        }

        .option-btn strong {
            color: var(--accent);
            margin-right: 4px;
        }

        /* Results */
        .result-header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }

        .type-code {
            font-size: 4em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 16px 0;
            letter-spacing: 6px;
        }

        .type-name {
            font-size: 1.5em;
            color: var(--primary);
            font-weight: 700;
        }

        .stack-info {
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            padding: 16px 20px;
            border-radius: var(--radius);
            margin: 24px 0;
            font-family: 'Inter', monospace;
            text-align: center;
            border: 1px solid #e2e8f0;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .description {
            font-size: 1.05em;
            text-align: justify;
            line-height: 1.8;
            color: #475569;
        }

        .restart-container {
            text-align: center;
            margin-top: 32px;
        }

        .scores-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .score-pair {
            background: #f8fafc;
            border-radius: var(--radius);
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .score-pair .dim-label {
            font-size: 0.75em;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .score-pair .dim-values {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--primary);
        }

        .score-pair .winner {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 18px;
            }
            .type-code {
                font-size: 3em;
            }
            .scores-summary {
                grid-template-columns: repeat(2, 1fr);
            }
            .gender-select {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 260px;
            }
        }

    </style>
</head>
<body>

<div class="container" id="app">
    <div id="intro-screen">
        <h1>Analiza Osobowości MBTI</h1>
        <p class="subtitle">Witaj w teście opartym na psychologii analitycznej Carla Junga.<br>Aby zapewnić precyzję algorytmu, prosimy o wskazanie płci (wpływa na kalibrację wymiaru Myślenie/Odczuwanie).</p>
        
        <div class="gender-select">
            <button class="btn" onclick="startTest('Male')">Mężczyzna</button>
            <button class="btn" onclick="startTest('Female')">Kobieta</button>
        </div>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="question-counter" id="question-counter"></div>
        <div id="question-container">
            </div>
    </div>

    <div id="result-screen" class="hidden">
        <div class="result-header">
            <h2>Twój typ osobowości to:</h2>
            <div class="type-code" id="result-code">XXXX</div>
            <div class="type-name" id="result-name">Nazwa Typu</div>
        </div>

        <div id="scores-display" class="scores-summary"></div>
        
        <div class="stack-info" id="cognitive-stack">
            </div>

        <div class="description" id="result-desc">
            </div>

        <div class="restart-container">
            <button class="btn" onclick="location.reload()">Rozpocznij ponownie</button>
        </div>
    </div>
</div>

<script>
    // --- BAZA DANYCH PYTAŃ (20 pytań: 5 × E/I, 5 × S/N, 5 × T/F, 5 × J/P) ---
    // Wagi: E/I (Energia), S/N (Percepcja), T/F (Ocena), J/P (Styl życia)
    const questions = [
        // === E vs I (5 pytań) ===
        {
            text: "Na imprezie towarzyskiej wolisz:",
            a: { text: "Rozmawiać z wieloma osobami i poznawać nowych ludzi", dim: "E" },
            b: { text: "Prowadzić głębszą rozmowę z jedną lub dwiema osobami", dim: "I" }
        },
        {
            text: "Po długim dniu pracy najlepiej regenerujesz się:",
            a: { text: "Wychodząc ze znajomymi — ludzie dodają Ci energii", dim: "E" },
            b: { text: "Spędzając czas w samotności lub w małym gronie bliskich", dim: "I" }
        },
        {
            text: "W pracy grupowej wolisz:",
            a: { text: "Myśleć na głos — burza mózgów w grupie", dim: "E" },
            b: { text: "Najpierw przemyśleć temat sam(a), potem dzielić się wnioskami", dim: "I" }
        },
        {
            text: "Jak reagujesz na ciszę w grupie?",
            a: { text: "Czuję potrzebę wypełnienia jej rozmową", dim: "E" },
            b: { text: "Ciszy jest mi dobrze — nie muszę jej wypełniać", dim: "I" }
        },
        {
            text: "Ludzie, którzy Cię dobrze nie znają, opisaliby Cię raczej jako:",
            a: { text: "Otwartą, towarzyską i łatwo nawiązującą kontakt osobę", dim: "E" },
            b: { text: "Spokojną, powściągliwą i trudną do odczytania osobę", dim: "I" }
        },

        // === S vs N (5 pytań) ===
        {
            text: "Kiedy uczysz się czegoś nowego, wolisz:",
            a: { text: "Konkretne przykłady i praktyczne instrukcje krok po kroku", dim: "S" },
            b: { text: "Zrozumienie ogólnej koncepcji i zasad stojących za tematem", dim: "N" }
        },
        {
            text: "Czytając książkę, bardziej zwracasz uwagę na:",
            a: { text: "Konkretne fakty, szczegóły i realistyczne wydarzenia", dim: "S" },
            b: { text: "Symbolikę, ukryte znaczenia i wizje przyszłości", dim: "N" }
        },
        {
            text: "Co bardziej Cię interesuje?",
            a: { text: "To, co jest tu i teraz — namacalne i sprawdzone", dim: "S" },
            b: { text: "To, co mogłoby być — możliwości i potencjał", dim: "N" }
        },
        {
            text: "W rozmowie częściej:",
            a: { text: "Mówię dosłownie i konkretnie — cenię precyzję", dim: "S" },
            b: { text: "Używam metafor i analogii — myślę abstrakcyjnie", dim: "N" }
        },
        {
            text: "Lepiej radzisz sobie z:",
            a: { text: "Zadaniami wymagającymi uważności na detale i procedury", dim: "S" },
            b: { text: "Zadaniami wymagającymi kreatywnego myślenia i innowacji", dim: "N" }
        },

        // === T vs F (5 pytań) ===
        {
            text: "Podejmując ważną decyzję, kierujesz się przede wszystkim:",
            a: { text: "Logiką, analizą za i przeciw, obiektywnymi danymi", dim: "T" },
            b: { text: "Wartościami, empatią i wpływem decyzji na ludzi", dim: "F" }
        },
        {
            text: "Znajomy prosi o opinię o swoim nowym projekcie, który ma wady. Ty:",
            a: { text: "Wskazujesz konkretne błędy — konstruktywna krytyka pomaga", dim: "T" },
            b: { text: "Najpierw doceniasz wysiłek, potem delikatnie sugerujesz zmiany", dim: "F" }
        },
        {
            text: "Co bardziej Cię denerwuje?",
            a: { text: "Niesprawiedliwość i brak logiki w argumentacji", dim: "T" },
            b: { text: "Bezduszność i brak empatii wobec czyichś uczuć", dim: "F" }
        },
        {
            text: "W konflikcie między dwiema osobami wolisz:",
            a: { text: "Być obiektywnym mediatorem — ustalić fakty i zasady", dim: "T" },
            b: { text: "Zadbać o uczucia obu stron i szukać harmonii", dim: "F" }
        },
        {
            text: "Lepiej opisuje Cię zdanie:",
            a: { text: "Szanuję logikę — prawda jest ważniejsza niż takt", dim: "T" },
            b: { text: "Szanuję ludzi — takt jest ważniejszy niż brutalna szczerość", dim: "F" }
        },

        // === J vs P (5 pytań) ===
        {
            text: "Jak podchodzisz do planowania weekendu?",
            a: { text: "Lubię mieć plan — wiem, co i kiedy będę robić", dim: "J" },
            b: { text: "Wolę zostawić opcje otwarte i zdecydować spontanicznie", dim: "P" }
        },
        {
            text: "W pracy nad projektem:",
            a: { text: "Robię plan, wyznaczam terminy i metodycznie je realizuję", dim: "J" },
            b: { text: "Pracuję zrywami inspiracji — deadline mnie mobilizuje", dim: "P" }
        },
        {
            text: "Twoje biurko / przestrzeń pracy jest raczej:",
            a: { text: "Uporządkowane — wszystko ma swoje miejsce", dim: "J" },
            b: { text: "Twórczo chaotyczne — wiem, gdzie co jest, mimo pozornego bałaganu", dim: "P" }
        },
        {
            text: "Kiedy musisz podjąć decyzję:",
            a: { text: "Wolę zdecydować szybko i zamknąć temat", dim: "J" },
            b: { text: "Wolę zbierać informacje i trzymać opcje otwarte jak najdłużej", dim: "P" }
        },
        {
            text: "Lepsze dla Ciebie jest życie:",
            a: { text: "Ustrukturyzowane — rutyna i przewidywalność dają spokój", dim: "J" },
            b: { text: "Elastyczne — spontaniczność i otwartość dają wolność", dim: "P" }
        }
    ];

    // --- BAZA WIEDZY (OPISY) ---
    const descriptions = {
        "INTJ": { name: "Architekt", desc: "Obdarzeni wyobraźnią strategiczni myśliciele. Widzą świat jako szachownicę. Są niezależni, analityczni i zdeterminowani. Cenią kompetencje i wiedzę ponad wszystko." },
        "INTP": { name: "Logik", desc: "Kreatywni wynalazcy z niewyczerpanym głodem wiedzy. Budują skomplikowane modele w głowie. Często zamyśleni, cenią precyzję logiczną bardziej niż konwenanse społeczne." },
        "ENTJ": { name: "Dowódca", desc: "Odważni liderzy z silną wolą. Zawsze znajdą drogę do celu albo ją stworzą. Są efektywni, zorganizowani i charyzmatyczni, czasem postrzegani jako bezwzględni w dążeniu do wyniku." },
        "ENTP": { name: "Dyskutant", desc: "Bystrzy i ciekawi myśliciele. Uwielbiają wyzwania intelektualne i debatę dla samej debaty. Szybko nudzą się rutyną, zawsze szukając nowych idei." },
        "INFJ": { name: "Rzecznik", desc: "Idealistyczni i enigmatyczni. Posiadają głęboką intuicję dotyczącą ludzi. Są zdeterminowani, by czynić świat lepszym, często działając jako cisi inspiratorzy." },
        "INFP": { name: "Pośrednik", desc: "Poetyckie, życzliwe dusze. Kierują się głębokimi wartościami wewnętrznymi. Są wrażliwi, kreatywni i szukają autentyczności we wszystkim co robią." },
        "ENFJ": { name: "Protagonista", desc: "Charyzmatyczni liderzy, którzy inspirują słuchaczy. Troszczą się o rozwój innych ludzi. Są empatyczni, ciepli i świetnie budują zespoły." },
        "ENFP": { name: "Działacz", desc: "Entuzjastyczne wolne duchy. Są towarzyscy, kreatywni i zawsze widzą powód do uśmiechu. Łączą ludzi i idee w nowatorski sposób." },
        "ISTJ": { name: "Logistyk", desc: "Praktyczni i faktograficzni. Można na nich polegać jak na Zawiszy. Cenią tradycję, porządek i bezpieczeństwo. Są fundamentem każdej organizacji." },
        "ISFJ": { name: "Obrońca", desc: "Bardzo oddani i ciepli opiekunowie. Dbają o szczegóły i pamiętają o potrzebach innych. Są pracowici, lojalni i unikają konfliktów." },
        "ESTJ": { name: "Wykonawca", desc: "Doskonali administratorzy. Zarządzają ludźmi i procedurami z żelazną konsekwencją. Cenią jasne zasady, hierarchię i efektywność." },
        "ESFJ": { name: "Doradca", desc: "Niezwykle troskliwi i towarzyscy. Popularni, zawsze chętni do pomocy. Dbają o harmonię w grupie i przestrzeganie norm społecznych." },
        "ISTP": { name: "Wirtuoz", desc: "Odważni i praktyczni eksperymentatorzy. Mistrzowie narzędzi. Są spokojni, ale potrafią działać błyskawicznie. Uczą się przez działanie." },
        "ISFP": { name: "Poszukiwacz Przygód", desc: "Elastyczni artyści. Żyją chwilą i wyrażają siebie poprzez estetykę i działanie. Są wrażliwi, unikają konfliktów i cenią wolność." },
        "ESTP": { name: "Przedsiębiorca", desc: "Mądrzy, energiczni i bardzo spostrzegawczy. Lubią życie na krawędzi i ryzyko. Świetnie radzą sobie w kryzysach i negocjacjach." },
        "ESFP": { name: "Animator", desc: "Spontaniczni i entuzjastyczni. Z nimi życie nigdy nie jest nudne. Kochają być w centrum uwagi i sprawiać, by inni dobrze się bawili." }
    };

    // --- LOGIKA APLIKACJI ---
    let userGender = "";
    let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    let currentQuestionIndex = 0;

    function startTest(gender) {
        userGender = gender;
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        
        document.getElementById('progress').style.width = progressPercent + "%";
        document.getElementById('question-counter').textContent =
            `Pytanie ${currentQuestionIndex + 1} z ${questions.length}`;
        
        const html = `
            <div class="question-card">
                <div class="question-text">${currentQuestionIndex + 1}. ${q.text}</div>
                <div class="options">
                    <button class="option-btn" onclick="answer('${q.a.dim}')">
                        <strong>A.</strong> ${q.a.text}
                    </button>
                    <button class="option-btn" onclick="answer('${q.b.dim}')">
                        <strong>B.</strong> ${q.b.text}
                    </button>
                </div>
            </div>
        `;
        document.getElementById('question-container').innerHTML = html;
    }

    function answer(dimension) {
        scores[dimension]++;
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            renderQuestion();
        } else {
            // Ustaw pasek postępu na 100% po ostatnim pytaniu
            document.getElementById('progress').style.width = "100%";
            showResults();
        }
    }

    // Algorytm obliczania wyniku z regułami tie-breaking
    function calculateType() {
        let type = "";

        // 1. E vs I (Tie-breaker: I)
        // Raport: "Kultura promuje E, więc remis sugeruje naturalne I"
        type += (scores.E > scores.I) ? "E" : "I";

        // 2. S vs N (Tie-breaker: N)
        // Raport: "N jako domyślne przy braku dowodów na S"
        type += (scores.S > scores.N) ? "S" : "N";

        // 3. T vs F (Tie-breaker: Gender dependent)
        if (scores.T > scores.F) {
            type += "T";
        } else if (scores.F > scores.T) {
            type += "F";
        } else {
            // Remis: Mężczyźni socjalizowani na T -> naturalne F
            // Kobiety socjalizowane na F -> naturalne T
            type += (userGender === "Male") ? "F" : "T";
        }

        // 4. J vs P (Tie-breaker: P)
        // Raport: "P oznacza otwartość, J wymaga dowodu struktury"
        type += (scores.J > scores.P) ? "J" : "P";

        return type;
    }

    function getCognitiveStack(type) {
        // Mapa funkcji kognitywnych dla wszystkich 16 typów
        const stacks = {
            "INTJ": "Ni > Te > Fi > Se", "INTP": "Ti > Ne > Si > Fe",
            "ENTJ": "Te > Ni > Se > Fi", "ENTP": "Ne > Ti > Fe > Si",
            "INFJ": "Ni > Fe > Ti > Se", "INFP": "Fi > Ne > Si > Te",
            "ENFJ": "Fe > Ni > Se > Ti", "ENFP": "Ne > Fi > Te > Si",
            "ISTJ": "Si > Te > Fi > Ne", "ISFJ": "Si > Fe > Ti > Ne",
            "ESTJ": "Te > Si > Ne > Fi", "ESFJ": "Fe > Si > Ne > Ti",
            "ISTP": "Ti > Se > Ni > Fe", "ISFP": "Fi > Se > Ni > Te",
            "ESTP": "Se > Ti > Fe > Ni", "ESFP": "Se > Fi > Te > Ni"
        };
        return stacks[type] || "";
    }

    function renderScores(finalType) {
        const pairs = [
            { a: "E", b: "I", label: "Energia" },
            { a: "S", b: "N", label: "Percepcja" },
            { a: "T", b: "F", label: "Ocena" },
            { a: "J", b: "P", label: "Styl życia" }
        ];

        let html = "";
        pairs.forEach((p, i) => {
            const winner = finalType[i];
            const aClass = winner === p.a ? "winner" : "";
            const bClass = winner === p.b ? "winner" : "";
            html += `
                <div class="score-pair">
                    <div class="dim-label">${p.label}</div>
                    <div class="dim-values">
                        <span class="${aClass}">${p.a}:${scores[p.a]}</span> / 
                        <span class="${bClass}">${p.b}:${scores[p.b]}</span>
                    </div>
                </div>
            `;
        });
        document.getElementById('scores-display').innerHTML = html;
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const finalType = calculateType();
        const data = descriptions[finalType];
        const stack = getCognitiveStack(finalType);

        document.getElementById('result-code').innerText = finalType;
        document.getElementById('result-name').innerText = data.name;
        document.getElementById('cognitive-stack').innerText = "Stos kognitywny: " + stack;
        document.getElementById('result-desc').innerText = data.desc;
        renderScores(finalType);
    }
</script>

</body>
</html>
