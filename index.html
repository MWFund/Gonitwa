<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover">
    <title>Gonitwa</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* CSS fixes for stable viewport heights */
        body {
            height: 100vh;
            overflow: hidden;
        }
        /* Safe-area insets */
        @supports(padding: env(safe-area-inset)) {
            body {
                padding: env(safe-area-inset);
            }
        }
        /* Smooth scrolling in overlays */
        .overlay {
            scroll-behavior: smooth;
        }
        /* Restrict hover effects to hover-capable devices */
        @media (hover: hover) {
            .hover-effect {
                transition: transform 0.2s;
            }
            .hover-effect:hover {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script src="game.js"></script>
</body>
</html>
