<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />

  <!-- Keep viewport-fit, but also set width/scale for correct layout on mobile -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />

  <title>Gonitwa</title>

  <!-- PWA: manifest + theme -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="application-name" content="Gonitwa" />

  <!-- iOS “installable” hints (won’t hurt on other platforms) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    /* CSS fixes for stable viewport heights */
    body {
      height: 100vh;
      overflow: hidden;
    }

    /* Safe-area insets */
    @supports (padding: env(safe-area-inset)) {
      body {
        padding: env(safe-area-inset);
      }
    }

    /* Smooth scrolling in overlays */
    .overlay {
      scroll-behavior: smooth;
    }

    /* Restrict hover effects to hover-capable devices */
    @media (hover: hover) {
      .hover-effect {
        transition: transform 0.2s;
      }
      .hover-effect:hover {
        transform: scale(1.05);
      }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <!-- Game -->
  <script src="game.js"></script>

  <!-- PWA: Service Worker registration (relative path => GitHub Pages friendly) -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {
          // optional: console.warn('SW registration failed', err);
        });
      });
    })();
  </script>
</body>
</html>
